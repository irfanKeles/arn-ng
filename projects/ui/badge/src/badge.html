@if (spinning()) {
  <svg
    class="arn-badge-spinner"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M21 12a9 9 0 1 1-6.22-8.56" />
  </svg>
}
@switch (mode()) {
  @case ('dot') {
    <span class="arn-badge-dot" aria-hidden="true"></span>
    @if (label()) {
      <span class="arn-badge-label">{{ label() }}</span>
    }
  }
  @case ('count') {
    @if (!hidden()) {
      {{ text() }}
    }
  }
  @default {
    <ng-content />
  }
}
