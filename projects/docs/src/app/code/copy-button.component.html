<button
  type="button"
  class="docs-copy-button"
  aria-label="Copy code"
  [attr.data-state]="state()"
  (click)="copy()"
>
  @if (state() === 'copied') {
    <svg
      class="docs-copy-svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
      data-icon="check"
    >
      <path d="M5 12.5l4.5 4.5L19 7.5" />
    </svg>
  } @else {
    <svg
      class="docs-copy-svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
      data-icon="copy"
    >
      <rect x="9" y="9" width="11" height="11" rx="2" />
      <path d="M5 15V6a2 2 0 0 1 2-2h8" />
    </svg>
  }
</button>

@if (state() === 'failed') {
  <span class="docs-copy-status">Copy failed</span>
}
