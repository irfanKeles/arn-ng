<div class="docs-setting">
  <label class="docs-setting-label" for="docs-setting-color-scheme">Theme</label>
  <select
    id="docs-setting-color-scheme"
    class="docs-setting-select"
    (change)="onColorScheme($event)"
  >
    @for (option of colorSchemes; track option.value) {
      <option [value]="option.value" [selected]="option.value === config.colorScheme()">
        {{ option.label }}
      </option>
    }
  </select>
</div>
