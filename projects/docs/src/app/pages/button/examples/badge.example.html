<div class="button-row">
  <button arnButton type="button" variant="outline">
    Inbox
    <arn-badge variant="secondary" [count]="12" />
  </button>
  <button arnButton type="button" variant="outline" iconOnly aria-label="Notifications, 3 unread">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    </svg>
    <arn-badge arnButtonBadge [count]="3" />
  </button>
  <button arnButton type="button" variant="outline" iconOnly aria-label="Messages, new messages">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    <arn-badge arnButtonBadge dot variant="destructive" />
  </button>
</div>
