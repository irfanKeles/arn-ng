    <p class="primary follows">calc(var(--arn-radius) * 0.8)</p>
    <p class="primary step">var(--arn-radius-md)</p>
  </section>

  <section class="panel brand" aria-labelledby="override-brand">
    <h3 id="override-brand" class="panel-title">.brand</h3>
    <p class="primary follows">calc(var(--arn-radius) * 0.8)</p>
    <p class="primary step">var(--arn-radius-md)</p>
  </section>
</div>
