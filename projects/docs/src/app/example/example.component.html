<div class="docs-example-demo"><ng-content /></div>

<div class="docs-example-bar">
  <span class="docs-example-label">Preview</span>

  <div class="docs-example-actions">
    @for (file of files(); track file.id) {
      <button
        #option
        type="button"
        class="docs-example-button docs-example-option"
        [attr.aria-pressed]="pressed(file.id)"
        [attr.aria-controls]="codeId"
        (click)="select(file.id)"
      >
        {{ file.label }}
      </button>
    }

    <button
      type="button"
      class="docs-example-button docs-example-icon docs-example-copy"
      aria-label="Copy code"
      (click)="copy()"
    >
      @if (copyState() === 'copied') {
        <svg
          class="docs-example-svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
          data-icon="check"
        >
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      } @else {
        <svg
          class="docs-example-svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
          data-icon="copy"
        >
          <rect x="9" y="9" width="11" height="11" rx="2" />
          <path d="M5 15V6a2 2 0 0 1 2-2h8" />
        </svg>
      }
    </button>

    @if (copyState() === 'failed') {
      <span class="docs-example-status">Copy failed</span>
    }

    @if (open()) {
      <button
        type="button"
        class="docs-example-button docs-example-icon docs-example-hide"
        aria-label="Hide code"
        (click)="hide()"
      >
        <svg
          class="docs-example-svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
          data-icon="close"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    }
  </div>
</div>

<div class="docs-example-code" [id]="codeId" [hidden]="!open()">
  @if (open()) {
    <docs-code-block
      [code]="shownCode()"
      [language]="activeFile().language"
      [label]="activeFile().label + ' code'"
      [lineNumbers]="true"
    />
  }
</div>
