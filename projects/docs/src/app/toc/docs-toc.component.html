<nav class="docs-toc-nav" aria-labelledby="docs-toc-title">
  <p id="docs-toc-title" class="docs-toc-title">On this page</p>
  <ul class="docs-toc-list">
    @for (section of sections(); track section) {
      <li>
        <a
          #link
          class="docs-toc-link"
          [href]="href(section.id())"
          [attr.data-section]="section.id()"
          [attr.aria-current]="active() === section.id() ? 'location' : null"
          (click)="follow($event, section.id())"
        >
          {{ section.heading() }}
        </a>
      </li>
    }
  </ul>
</nav>
