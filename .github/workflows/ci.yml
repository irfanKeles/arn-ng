name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19, and the browser's system libraries
    # are not verified there yet (see the Ubuntu 26 trial item in ROADMAP.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Vitest browser mode runs in Playwright's Chromium, not in the Chrome of the runner image.
      # No --with-deps: the runner image already has the browser libraries; --with-deps pulls
      # fonts and mesa updates through a mirror that was measured at 54 kB/s (up to 10 minutes).
      # If a library is missing, Chromium fails to launch with a clear error.
      - name: Playwright Chromium
        run: npx playwright install chromium

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:ui
      - run: npm run build:docs
      - run: npm run test:ci

  # The ui tests in Firefox and WebKit (Playwright), one job per browser, in parallel with `ci`.
  # No coverage: the V8 provider works only in Chromium (`test:ci` keeps it). docs stays in
  # Chromium. Playwright ships current Firefox and WebKit builds: this does not verify the browser
  # baseline (Firefox 120, Safari 17.5).
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No --with-deps, as for Chromium above. If WebKit fails to launch on a missing system
      # library, the fallback is `npx playwright install-deps webkit` for that row only.
      - name: Playwright ${{ matrix.browser }}
        run: npx playwright install ${{ matrix.browser }}

      - run: npm run test:${{ matrix.browser }}
