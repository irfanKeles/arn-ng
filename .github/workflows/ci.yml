name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Sabit: ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçti; Playwright'ın --with-deps kurulumu sürüme bağlı
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Vitest browser mode Playwright'ın Chromium'unda koşar; imajdaki Chrome'a dayanmaz
      # No --with-deps: the runner image already has the browser libraries; --with-deps pulls
      # fonts and mesa updates through a mirror that was measured at 54 kB/s (up to 10 minutes).
      # If a library is missing, Chromium fails to launch with a clear error.
      - name: Playwright Chromium
        run: npx playwright install chromium

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:ui
      - run: npm run build:docs
      - run: npm run test:ci
