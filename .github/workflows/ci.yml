name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Sabit: ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçti; Playwright'ın --with-deps kurulumu sürüme bağlı
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Vitest browser mode Playwright'ın Chromium'unda koşar; imajdaki Chrome'a dayanmaz
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:ui
      - run: npm run build:docs
      - run: npm run test:ci
