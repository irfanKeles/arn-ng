name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Sabit: ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçti; Karma imajdaki Chrome'a dayanır
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Karma testleri runner imajındaki Chrome'u kullanır; yoksa burada net hatayla düşer
      - name: Chrome sürümü
        run: google-chrome --version

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:ui
      - run: npm run build:docs
      - run: npm run test:ci
