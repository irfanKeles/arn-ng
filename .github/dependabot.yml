version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Angular majors are moved by hand: the peer ranges (^22) change only after a tested upgrade,
    # so Angular and the tools tied to it get no major updates here
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: ng-packagr
        update-types: ['version-update:semver-major']
      # The Angular compiler pins a TypeScript minor range (Angular 22.2: >=6.0 <6.1); a minor
      # update breaks the build too
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: rxjs
        update-types: ['version-update:semver-major']
      # angular-eslint supports a fixed set of ESLint majors; @eslint/js stays on eslint's major
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: angular-eslint
        update-types: ['version-update:semver-major']
      # @angular/build:unit-test Vitest'in desteklediği majörlere bağlı (peer aralığı)
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # Node 22'ye bağlı: tip majörü de 22'de kalır
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
